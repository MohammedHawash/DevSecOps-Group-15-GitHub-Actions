name: Python Install
description: Install Python and the project dependencies

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"
  requirements-file:
    description: Path to the requirements file
    required: false
    default: requirements.txt

runs:
  using: composite
  steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip

    - name: Install Dependencies
      shell: bash
      env:
        REQ_FILE: ${{ inputs.requirements-file }}
      run: pip install -r "$REQ_FILE"

    - name: Verify Installation
      shell: bash
      run: |
        python --version
        pip --version