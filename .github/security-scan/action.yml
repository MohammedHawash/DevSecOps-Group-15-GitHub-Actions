name: Security Scan
description: Run Gitleaks, TruffleHog and Trivy filesystem scans

inputs:
  severity:
    description: Trivy severities that fail the scan
    required: false
    default: HIGH,CRITICAL
  scan-path:
    description: Path for the Trivy filesystem scan
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Gitleaks
      shell: bash
      run: |
        docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
          detect --source /repo --verbose --redact

    - name: TruffleHog
      if: ${{ !cancelled() }}
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --results=verified,unknown

    - name: Trivy filesystem
      if: ${{ !cancelled() }}
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.scan-path }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: true
        exit-code: '1'
